name: Build Android APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build OpenTV, EriTV TV, and EriTV Mobile
        run: gradle :app:assembleDebug :eritv:assembleDebug :eritv-mobile:assembleDebug
      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OpenTV-v1.4.1.apk
          cp eritv/build/outputs/apk/debug/eritv-debug.apk EriTV-v1.2.0.apk
          cp eritv-mobile/build/outputs/apk/debug/eritv-mobile-debug.apk EriTV-Mobile-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APKs
          path: |
            OpenTV-v1.4.1.apk
            EriTV-v1.2.0.apk
            EriTV-Mobile-v1.0.0.apk
      - name: Publish OpenTV test release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.4.1-test --yes --cleanup-tag || true
          gh release create v1.4.1-test OpenTV-v1.4.1.apk --title "OpenTV v1.4.1 Test Build" --notes "EriTV-proven larger buffer and 90-second stall tolerance applied to every channel."
      - name: Publish EriTV TV test release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete eritv-v1.2.0-test --yes --cleanup-tag || true
          gh release create eritv-v1.2.0-test EriTV-v1.2.0.apk --title "EriTV v1.2.0 Test Build" --notes "EriTV 1.2: smarter live HLS recovery, 6 segment load retries, 90-second stall tolerance, stable 120-second buffer, reconnect cancellation and live-window handling."
      - name: Publish EriTV Mobile test release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete eritv-mobile-v1.0.0-test --yes --cleanup-tag || true
          gh release create eritv-mobile-v1.0.0-test EriTV-Mobile-v1.0.0.apk --title "EriTV Mobile v1.0.0 Test Build" --notes "Pixel-friendly single-channel EriTV: immersive playback, auto-rotation, same proven TV buffering and automatic reconnection."
