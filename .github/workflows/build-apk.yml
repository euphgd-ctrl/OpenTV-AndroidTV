name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OpenTV-v1.3.3.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTV-debug-apk
          path: OpenTV-v1.3.3.apk
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.3.3-test --yes --cleanup-tag || true
          gh release create v1.3.3-test OpenTV-v1.3.3.apk --title "OpenTV v1.3.3 Test Build" --notes "v1.3.3 test build: compact top-left reconnect spinner."
