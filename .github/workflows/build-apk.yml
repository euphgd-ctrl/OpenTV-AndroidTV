name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build OpenTV and EriTV
        run: gradle :app:assembleDebug :eritv:assembleDebug
      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OpenTV-v1.4.1.apk
          cp eritv/build/outputs/apk/debug/eritv-debug.apk EriTV-v1.1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-TV-APKs
          path: |
            OpenTV-v1.4.1.apk
            EriTV-v1.1.1.apk
      - name: Publish OpenTV test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.4.1-test --yes --cleanup-tag || true
          gh release create v1.4.1-test OpenTV-v1.4.1.apk --title "OpenTV v1.4.1 Test Build" --notes "EriTV-proven larger buffer and 90-second stall tolerance applied to every channel."
      - name: Publish EriTV test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete eritv-v1.1.1-test --yes --cleanup-tag || true
          gh release create eritv-v1.1.1-test EriTV-v1.1.1.apk --title "EriTV v1.1.1 Test Build" --notes "EriTV v1.1: larger HLS buffer and less aggressive stall recovery."
