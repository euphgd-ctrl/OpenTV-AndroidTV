name: Build Android APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]
permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install official Eritrean flag artwork for EriTV
        run: |
          set -euo pipefail
          # Public-domain official flag SVG, including the complete olive wreath.
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Flag_of_Eritrea.svg' \
            -o /tmp/eritrea-official.svg
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from io import BytesIO
          from pathlib import Path
          src = Path('/tmp/eritrea-official.svg').read_bytes()
          if b'<svg' not in src[:1000]:
              raise SystemExit('Official flag download was not SVG')
          out = Path('eritv/src/main/res/drawable-nodpi')
          out.mkdir(parents=True, exist_ok=True)
          cairosvg.svg2png(bytestring=src, write_to=str(out / 'eritrea_official.png'),
                           output_width=1200, output_height=600)
          flag = Image.open(BytesIO(cairosvg.svg2png(bytestring=src, output_width=512, output_height=256))).convert('RGBA')
          icon = Image.new('RGBA', (512, 512), '#151515')
          icon.paste(flag, (0, 128), flag)
          icon.save(out / 'eritrea_icon.png')
          PY
      - name: Restore or initialize encrypted EriTV signing key
        if: github.event_name != 'pull_request'
        env:
          ERITV_SIGNING_PASSPHRASE: ${{ secrets.ERITV_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$ERITV_SIGNING_PASSPHRASE" ]; then
            echo "::warning::EriTV signed publishing disabled. Configure repository secret ERITV_SIGNING_PASSPHRASE first."
            echo "ERITV_SIGNING_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p signing
          KEY="$RUNNER_TEMP/eritv-signing.p12"
          if [ -f signing/eritv-release.p12.enc ]; then
            openssl enc -d -aes-256-cbc -salt -pbkdf2 -iter 500000 \
              -pass env:ERITV_SIGNING_PASSPHRASE \
              -in signing/eritv-release.p12.enc -out "$KEY"
          else
            keytool -genkeypair -keystore "$KEY" -storetype PKCS12 -alias eritv \
              -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=EriTV App Signing, OU=Android TV, O=EriTV, C=CA" \
              -storepass:env ERITV_SIGNING_PASSPHRASE \
              -keypass:env ERITV_SIGNING_PASSPHRASE -noprompt
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 500000 \
              -pass env:ERITV_SIGNING_PASSPHRASE \
              -in "$KEY" -out signing/eritv-release.p12.enc
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/eritv-release.p12.enc
            git commit -m "Store encrypted persistent EriTV signing key"
            git push origin HEAD:main
          fi
          keytool -list -keystore "$KEY" -alias eritv \
            -storepass:env ERITV_SIGNING_PASSPHRASE >/dev/null
          echo "ERITV_KEYSTORE_PATH=$KEY" >> "$GITHUB_ENV"
          echo "ERITV_SIGNING_READY=true" >> "$GITHUB_ENV"
      - name: Build OpenTV, EriTV TV, and EriTV Mobile
        env:
          ERITV_SIGNING_PASSPHRASE: ${{ secrets.ERITV_SIGNING_PASSPHRASE }}
        run: gradle :app:assembleDebug :eritv:assembleDebug :eritv-mobile:assembleDebug
      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OpenTV-v1.5.0.apk
          cp eritv/build/outputs/apk/debug/eritv-debug.apk EriTV-v1.3.1.apk
          cp eritv-mobile/build/outputs/apk/debug/eritv-mobile-debug.apk EriTV-Mobile-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APKs
          path: |
            OpenTV-v1.5.0.apk
            EriTV-v1.3.1.apk
            EriTV-Mobile-v1.0.0.apk
      - name: Publish OpenTV test release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.5.0-test --yes --cleanup-tag || true
          gh release create v1.5.0-test OpenTV-v1.5.0.apk --title "OpenTV v1.5.0 Test Build" --notes "EriTV 1.2-proven HLS recovery: safer segment retries, delayed stall handling, live-window recovery and cancellation of unnecessary reconnects."
      - name: Publish EriTV TV test release
        if: github.event_name != 'pull_request' && env.ERITV_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete eritv-v1.3.1-test --yes --cleanup-tag || true
          gh release create eritv-v1.3.1-test EriTV-v1.3.1.apk --latest=false --title "EriTV v1.3.1 Test Build" --notes "EriTV 1.3.1: verified optional in-app updater, permanent encrypted signing key, official flag, proven playback."
      - name: Ensure EriTV release is public
        if: github.event_name != 'pull_request' && env.ERITV_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit eritv-v1.3.1-test --draft=false
      - name: Publish verified EriTV APK and update metadata
        if: github.event_name != 'pull_request' && env.ERITV_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp EriTV-v1.3.1.apk EriTV.apk
          VERSION_CODE=$(grep -oE 'versionCode=[0-9]+' eritv/build.gradle.kts | head -1 | cut -d= -f2)
          VERSION_NAME=$(grep -oE 'versionName="[0-9.]+"' eritv/build.gradle.kts | head -1 | cut -d'"' -f2)
          SHA256=$(sha256sum EriTV.apk | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/eritv-current/EriTV.apk"
          jq -n --argjson versionCode "$VERSION_CODE" --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$URL" --arg sha256 "$SHA256" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,sha256:$sha256}' \
            > eritv-update.json
          if gh release view eritv-current >/dev/null 2>&1; then
            gh release upload eritv-current EriTV.apk --clobber
          else
            gh release create eritv-current EriTV.apk --latest=false \
              --title "EriTV Android TV - Current Download" \
              --notes "Permanent EriTV download URL for Downloader code 6861670."
          fi
          gh release upload eritv-current eritv-update.json --clobber
          gh release edit eritv-current --draft=false
          test "$(gh release view eritv-current --json assets --jq '.assets[].name' | grep -cx 'EriTV.apk')" -eq 1
          test "$(gh release view eritv-current --json assets --jq '.assets[].name' | grep -cx 'eritv-update.json')" -eq 1
          mkdir -p updates
          cp eritv-update.json updates/eritv.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/eritv.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish EriTV update metadata for older app versions"
            git push origin HEAD:main
          fi
          echo "Published signed EriTV $VERSION_NAME ($VERSION_CODE): $URL"
      - name: Publish EriTV Mobile test release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete eritv-mobile-v1.0.0-test --yes --cleanup-tag || true
          gh release create eritv-mobile-v1.0.0-test EriTV-Mobile-v1.0.0.apk --title "EriTV Mobile v1.0.0 Test Build" --notes "Pixel-friendly single-channel EriTV: immersive playback, auto-rotation, same proven TV buffering and automatic reconnection."
